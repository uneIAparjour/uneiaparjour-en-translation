name: Translate FR articles to EN

on:
  schedule:
    # Once a day. Covers both the graduated backlog rollout (phases 04-06)
    # and the ongoing daily flow (phase 07) with the same workflow.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: false
      limit:
        description: 'Max posts to process this run'
        type: string
        default: '15'
      repair_links:
        description: 'Run the link-repair pass instead of translating'
        type: boolean
        default: false
      repair_images:
        description: 'Run the image-block repair pass instead of translating'
        type: boolean
        default: false
      repair_image_blocks:
        description: 'Fix wp:image lightbox mismatches + broken gallery HTML (2026-08-18 bug) instead of translating'
        type: boolean
        default: false
      only_fr_id:
        description: 'With repair_image_blocks: limit to one FR post ID (leave empty for all)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: script
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run translation script
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: |
          ARGS=""
          if [ "${{ inputs.repair_links }}" = "true" ]; then
            ARGS="--repair-links"
          elif [ "${{ inputs.repair_images }}" = "true" ]; then
            ARGS="--repair-images"
          elif [ "${{ inputs.repair_image_blocks }}" = "true" ]; then
            ARGS="--repair-image-blocks"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.only_fr_id }}" ]; then
              ARGS="$ARGS --only-fr-id=${{ inputs.only_fr_id }}"
            fi
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="--dry-run"
            fi
            ARGS="$ARGS --limit=${{ inputs.limit || '15' }}"
          fi
          node translate.js $ARGS

      - name: Commit updated state
        run: |
          git config user.name "translation-bot"
          git config user.email "actions@github.com"
          git add state/translations.json config/taxonomy-map.json
          git diff --cached --quiet || git commit -m "Update translation state [skip ci]"
          git push
