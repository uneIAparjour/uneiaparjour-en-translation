name: Translate FR articles to EN

on:
  schedule:
    # Once a day. Covers both the graduated backlog rollout (phases 04-06)
    # and the ongoing daily flow (phase 07) with the same workflow.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: false
      limit:
        description: 'Max posts to process this run'
        type: string
        default: '200'
      repair_links:
        description: 'Run the link-repair pass instead of translating'
        type: boolean
        default: false
      repair_images:
        description: 'Run the image-block repair pass instead of translating'
        type: boolean
        default: false
      fix_media:
        description: 'Fix image/gallery blocks by copying clean markup from FR source (2026-08-18 bug) instead of translating'
        type: boolean
        default: false
      only_fr_id:
        description: 'Limit to specific FR post ID(s), comma-separated (e.g. 18075,18119) — works with fix_media AND normal translation runs. Leave empty for the default behavior.'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: script
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run translation script
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: |
          ARGS=""
          if [ "${{ inputs.repair_links }}" = "true" ]; then
            ARGS="--repair-links"
          elif [ "${{ inputs.repair_images }}" = "true" ]; then
            ARGS="--repair-images"
          elif [ "${{ inputs.fix_media }}" = "true" ]; then
            ARGS="--fix-media"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.only_fr_id }}" ]; then
              ARGS="$ARGS --only-fr-id=${{ inputs.only_fr_id }}"
            fi
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="--dry-run"
            fi
            ARGS="$ARGS --limit=${{ inputs.limit || '200' }}"
            if [ -n "${{ inputs.only_fr_id }}" ]; then
              ARGS="$ARGS --only-fr-id=${{ inputs.only_fr_id }}"
            fi
          fi
          node translate.js $ARGS

      # 2026-09-01: chained in after translate.js so the daily flow (phase
      # 07) is fully automatic — direct-publish-then-QA was validated
      # manually at scale on 2026-08-28/31 (thousands of posts, ~1-3%
      # title-only error rate, 0 broken content), so the standing
      # draft-then-manual-publish gate is no longer needed for the normal
      # daily trickle. Skipped for any special-purpose run (dry-run,
      # repair passes, single-post reruns via only_fr_id) — those aren't
      # the regular daily flow and shouldn't auto-publish as a side effect.
      - name: Publish newly translated EN posts
        if: ${{ inputs.dry_run != 'true' && inputs.repair_links != 'true' && inputs.repair_images != 'true' && inputs.fix_media != 'true' }}
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node publish.js --limit=250

      - name: Commit updated state
        run: |
          git config user.name "translation-bot"
          git config user.email "actions@github.com"
          git add state/translations.json config/taxonomy-map.json
          git diff --cached --quiet || git commit -m "Update translation state [skip ci]"
          git push
