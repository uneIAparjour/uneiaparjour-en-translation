name: Publish translated EN drafts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes, preview only)'
        type: boolean
        default: true
      limit:
        description: 'Max drafts to publish this run'
        type: string
        default: '15'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: script
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish draft EN posts
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          ARGS="--limit=${{ inputs.limit || '15' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node publish.js $ARGS
